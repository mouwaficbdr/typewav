name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm typecheck

      # Root lint covers .js/.mjs/.cjs; the app lint (eslint-config-next)
      # covers apps/web TypeScript. Package-wide TS linting is hardened
      # in a follow-up step of the safety-net work.
      - name: Lint
        run: |
          pnpm lint
          pnpm --filter @typewav/web lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
